# Heltec WiFi LoRa 32 V3 (ESP32-S3, 8 MB flash, SX1262, OLED).
# Sources and verification status are in README.md beside this file.
esp32:
  board: heltec_wifi_lora_32_V3
  flash_size: 8MB
  framework:
    type: esp-idf

spi:
  - id: lora_spi
    clk_pin: GPIO9
    mosi_pin: GPIO10
    miso_pin: GPIO11

sx126x:
  - id: lora_radio
    spi_id: lora_spi
    hw_version: sx1262
    cs_pin: GPIO8
    rst_pin: GPIO12
    busy_pin: GPIO13
    dio1_pin: GPIO14
    rf_switch: true
    tcxo_voltage: 1_8V
    tcxo_delay: 5ms

# Vext is active low; the application selects its startup power policy.
power_supply:
  - id: oled_power
    pin:
      number: GPIO36
      inverted: true

i2c:
  - id: oled_i2c
    sda: GPIO17
    scl: GPIO18
    frequency: 400kHz
    # The display checks its own connection; no full bus scan is needed.
    scan: false

display:
  - platform: ssd1306_i2c
    id: oled_display
    i2c_id: oled_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    reset_pin: GPIO21

binary_sensor:
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true

output:
  - platform: gpio
    id: led_output
    pin: GPIO35
  # Active-low divider gate per the earlier schematic. Revisions can invert this;
  # see README.md before using the ADC on another hardware revision.
  - platform: gpio
    id: battery_adc_enable
    pin:
      number: GPIO37
      inverted: true

sensor:
  - platform: adc
    id: battery_voltage
    name: Battery Voltage
    pin: GPIO1
    attenuation: 0db
    samples: 8
    # The application enables the divider, waits, samples, then disables it.
    update_interval: never
    filters:
      - multiply: 4.9  # (390k + 100k) / 100k; ESPHome reports calibrated volts.

light:
  - platform: binary
    id: led
    name: Board LED
    output: led_output
